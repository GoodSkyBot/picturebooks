<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Triassic animals sharing the same land</title>
  <desc id="desc">A simple original illustration showing an early dinosaur, a crocodile-line reptile, and a small mammal relative in the same Triassic landscape.</desc>
  <rect width="1200" height="800" fill="#edd39a"/>
  <path d="M0 530 C190 490 330 545 510 500 C700 450 860 525 1200 470 L1200 800 L0 800 Z" fill="#b8743a"/>
  <path d="M0 680 C230 620 410 690 640 640 C850 595 1000 640 1200 605 L1200 800 L0 800 Z" fill="#7aa089" opacity="0.58"/>
  <g fill="none" stroke="#2e5e4e" stroke-width="9" stroke-linecap="round">
    <path d="M105 545 C100 500 115 468 145 438"/>
    <path d="M145 438 L115 405 M145 438 L177 408 M145 438 L148 392"/>
    <path d="M1015 530 C1010 485 1030 450 1060 415"/>
    <path d="M1060 415 L1020 380 M1060 415 L1100 380 M1060 415 L1066 365"/>
  </g>
  <g transform="translate(140 360) scale(.68)">
    <ellipse cx="170" cy="115" rx="145" ry="54" fill="#8b3e1f"/>
    <path d="M60 112 C-35 82 -95 55 -165 14" stroke="#8b3e1f" stroke-width="36" stroke-linecap="round" fill="none"/>
    <path d="M300 94 C365 63 424 70 475 108" stroke="#8b3e1f" stroke-width="40" stroke-linecap="round" fill="none"/>
    <circle cx="495" cy="108" r="36" fill="#8b3e1f"/>
    <circle cx="508" cy="97" r="5" fill="#111"/>
    <path d="M135 158 L92 275 M200 158 L258 273" stroke="#633017" stroke-width="26" stroke-linecap="round"/>
    <path d="M94 276 L36 284 M260 274 L322 282" stroke="#633017" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g transform="translate(555 505)">
    <ellipse cx="130" cy="70" rx="155" ry="42" fill="#455f3b"/>
    <path d="M-10 68 C-80 55 -130 42 -185 10" stroke="#455f3b" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M275 58 C330 40 390 45 450 70" stroke="#455f3b" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M443 48 L520 72 L443 92 Z" fill="#455f3b"/>
    <circle cx="468" cy="62" r="5" fill="#111"/>
    <path d="M45 104 L20 145 M105 108 L85 150 M165 108 L190 148 M225 102 L260 140" stroke="#31442b" stroke-width="15" stroke-linecap="round"/>
    <text x="145" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#31442b">crocodile-line reptile</text>
  </g>
  <g transform="translate(800 405)">
    <ellipse cx="70" cy="80" rx="72" ry="34" fill="#6d4b3a"/>
    <circle cx="142" cy="70" r="28" fill="#6d4b3a"/>
    <circle cx="151" cy="62" r="4" fill="#111"/>
    <path d="M4 82 C-45 78 -82 92 -122 118" stroke="#6d4b3a" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M35 108 L20 145 M80 110 L95 145" stroke="#4a3328" stroke-width="12" stroke-linecap="round"/>
    <path d="M132 44 L118 20 M150 44 L160 20" stroke="#6d4b3a" stroke-width="8" stroke-linecap="round"/>
    <text x="70" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#4a3328">mammal relative</text>
  </g>
  <text x="600" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#5b321e">Early dinosaurs were only part of the Triassic crowd.</text>
</svg>
