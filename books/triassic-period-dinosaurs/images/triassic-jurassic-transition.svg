<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Dinosaurs survive into the Jurassic</title>
  <desc id="desc">A simple educational illustration showing a dark volcanic Triassic sky on one side and a brighter Jurassic landscape with surviving dinosaurs on the other.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1">
      <stop offset="0" stop-color="#6b4a45"/>
      <stop offset="0.48" stop-color="#8b5a42"/>
      <stop offset="0.52" stop-color="#e7b966"/>
      <stop offset="1" stop-color="#9fd1b0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <path d="M95 510 L230 210 L365 510 Z" fill="#4a3834"/>
  <path d="M230 210 C255 148 290 118 336 96" fill="none" stroke="#5b5756" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
  <path d="M0 560 C190 520 340 570 520 535 C720 500 890 540 1200 505 L1200 800 L0 800 Z" fill="#6f5b37"/>
  <path d="M610 585 C780 535 955 565 1200 520 L1200 800 L610 800 Z" fill="#4e8a52"/>
  <line x1="600" y1="90" x2="600" y2="710" stroke="#fff3d5" stroke-width="8" stroke-dasharray="24 22" opacity="0.8"/>
  <text x="300" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#fff3d5">Triassic ends</text>
  <text x="900" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#204d3d">Jurassic begins</text>
  <g transform="translate(720 430) scale(.78)">
    <ellipse cx="150" cy="90" rx="120" ry="45" fill="#2e7d5b"/>
    <path d="M55 88 C-25 62 -80 42 -135 5" fill="none" stroke="#2e7d5b" stroke-width="30" stroke-linecap="round"/>
    <path d="M255 73 C315 45 365 53 402 88" fill="none" stroke="#2e7d5b" stroke-width="36" stroke-linecap="round"/>
    <circle cx="418" cy="87" r="34" fill="#2e7d5b"/>
    <circle cx="430" cy="76" r="5" fill="#111"/>
    <path d="M115 130 L70 230 M175 130 L225 228" stroke="#1d5f45" stroke-width="23" stroke-linecap="round"/>
    <path d="M72 232 L18 240 M228 230 L284 238" stroke="#1d5f45" stroke-width="13" stroke-linecap="round"/>
  </g>
  <g transform="translate(880 520) scale(.46)">
    <ellipse cx="150" cy="90" rx="120" ry="45" fill="#d48a2f"/>
    <path d="M55 88 C-25 62 -80 42 -135 5" fill="none" stroke="#d48a2f" stroke-width="30" stroke-linecap="round"/>
    <path d="M255 73 C315 45 365 53 402 88" fill="none" stroke="#d48a2f" stroke-width="36" stroke-linecap="round"/>
    <circle cx="418" cy="87" r="34" fill="#d48a2f"/>
    <circle cx="430" cy="76" r="5" fill="#111"/>
    <path d="M115 130 L70 230 M175 130 L225 228" stroke="#a96621" stroke-width="23" stroke-linecap="round"/>
  </g>
  <text x="600" y="735" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#fff3d5">Many animals vanished, but dinosaurs survived.</text>
</svg>
