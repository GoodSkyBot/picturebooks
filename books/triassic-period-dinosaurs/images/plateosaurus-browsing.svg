    <path d="M192 392 L125 400 M455 390 L520 400" stroke="#6f542c" stroke-width="18" stroke-linecap="round"/>
    <path d="M535 177 L600 225 M520 195 L575 252" stroke="#6f542c" stroke-width="20" stroke-linecap="round"/>
  </g>
  <text x="600" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#5b321e">Plateosaurus used its long neck to reach plants.</text>
