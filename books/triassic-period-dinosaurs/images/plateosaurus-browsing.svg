<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Plateosaurus browsing on Triassic plants</title>
  <desc id="desc">A child-friendly original illustration of Plateosaurus using its long neck to reach leaves from a Triassic tree.</desc>
  <rect width="1200" height="800" fill="#ead59b"/>
  <path d="M0 575 C230 535 445 580 650 530 C870 475 1005 540 1200 500 L1200 800 L0 800 Z" fill="#b56c35"/>
