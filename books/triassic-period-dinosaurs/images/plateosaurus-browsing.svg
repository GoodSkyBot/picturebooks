    <g fill="#2e7d5b">
      <ellipse cx="95" cy="100" rx="62" ry="26" transform="rotate(-20 95 100)"/>
      <ellipse cx="165" cy="118" rx="70" ry="28" transform="rotate(18 165 118)"/>
      <ellipse cx="55" cy="162" rx="60" ry="25" transform="rotate(22 55 162)"/>
      <ellipse cx="152" cy="185" rx="73" ry="28" transform="rotate(-15 152 185)"/>
      <ellipse cx="92" cy="235" rx="70" ry="27"/>
    </g>
  </g>
  <g transform="translate(150 345)">
