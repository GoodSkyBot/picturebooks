<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picture Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f1df;
        color: #233124;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Baloo 2", cursive;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        font-weight: 700;
      }

      .intro {
        max-width: 44rem;
        line-height: 1.6;
        font-size: 1.1rem;
        margin: 0 0 36px;
      }

      .books {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }

      .book-card {
        display: block;
        border-radius: 20px;
        background: #ffffff;
        color: inherit;
        text-decoration: none;
        border: 2px solid #d8cfaa;
        border-left: 6px solid var(--accent);
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .book-card:hover,
      .book-card:focus-visible {
        transform: scale(1.03);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        border-color: var(--accent);
        outline: none;
      }

      .book-card img {
        display: block;
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .book-info {
        padding: 20px 22px 24px;
      }

      .book-title {
        margin: 0 0 6px;
        font-family: "Baloo 2", cursive;
        font-size: 1.4rem;
        font-weight: 700;
      }

      .book-subtitle {
        margin: 0;
        font-size: 1rem;
        color: #55674e;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        .book-card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Picture Books</h1>
      <p class="intro">
        Nonfiction picture books for kids, built as self-contained websites.
      </p>
      <ul class="books">
        
        <li>
          <a class="book-card" href="/books/american-revolution/" style="--accent: #1B3A5C">
            <img src="/books/american-revolution/images/trumbull-declaration-painting.jpg"
                 alt="America&#39;s Birthday"
                 loading="lazy">
            <div class="book-info">
              <p class="book-title">America&#39;s Birthday</p>
              <p class="book-subtitle">The Story of the Fourth of July</p>
            </div>
          </a>
        </li>
        
        <li>
          <a class="book-card" href="/books/frogs/" style="--accent: #2E7D32">
            <img src="/books/frogs/images/a-bright-green-tree-frog-mid-leap-above-a-pond-water-droplet.png"
                 alt="Fabulous Frogs"
                 loading="lazy">
            <div class="book-info">
              <p class="book-title">Fabulous Frogs</p>
              <p class="book-subtitle">A Hop into the World of Frogs</p>
            </div>
          </a>
        </li>
        
        <li>
          <a class="book-card" href="/books/velociraptors/" style="--accent: #C75B12">
            <img src="/books/velociraptors/images/velociraptor-cover.png"
                 alt="Velociraptor: The Swift Thief"
                 loading="lazy">
            <div class="book-info">
              <p class="book-title">Velociraptor: The Swift Thief</p>
              <p class="book-subtitle">A Real Dinosaur Story</p>
            </div>
          </a>
        </li>
        
      </ul>
    </main>
  </body>
</html>
